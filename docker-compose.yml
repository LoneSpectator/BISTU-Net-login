services:
    bistu-login:
        image: ${BISTU_LOGIN_IMAGE:-bistu-login:local}
        build: .
        container_name: bistu-login
        restart: unless-stopped
        network_mode: host
        read_only: true
        tmpfs:
            - /tmp:size=1m,mode=1777
        cap_drop:
            - ALL
        cap_add:
            - NET_RAW
        security_opt:
            - no-new-privileges:true
        volumes:
            - ./data:/data
